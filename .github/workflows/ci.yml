name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Enforce CSS growth budget
        run: npm run css:audit

      - name: Run unit tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Verify generated seed is current
        run: npm run seed:check
